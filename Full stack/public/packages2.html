<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour Packages — Seven Sisters Travel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <main id="app"></main>
  <script src="js/components.js"></script>
  <script src="js/api.js"></script>
  <script>
    renderNavbar();

    const app = document.getElementById("app");
    app.innerHTML = `
<div class="page-hero">
  <div class="container">
    <p class="section-label" style="color:rgba(255,255,255,.7)">Curated Journeys</p>
    <h1>Tour Packages</h1>
    <p>Expertly crafted itineraries across all eight Northeast Indian states.</p>
  </div>
</div>
<section class="section-sm">
  <div class="container">
    <div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:center;margin-bottom:2rem">
      <select class="form-control" id="stateFilter" style="max-width:200px">
        <option value="">All States</option>
      </select>
      <select class="form-control" id="sortFilter" style="max-width:200px">
        <option value="">Default</option>
        <option value="price_asc">Price: Low to High</option>
        <option value="price_desc">Price: High to Low</option>
        <option value="rating">Highest Rated</option>
      </select>
      <span id="pkgCount" class="text-muted" style="margin-left:auto;font-size:.88rem"></span>
    </div>
    <div id="packagesGrid">${spinner()}</div>
  </div>
</section>`;

    let allPackages = [];

    async function loadPackages() {
      const [pkgs, states] = await Promise.all([packagesApi.list(), statesApi.list()]);
      allPackages = pkgs;

      // Populate state filter
      const sf = document.getElementById("stateFilter");
      states.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.name;
        opt.textContent = s.name;
        sf.appendChild(opt);
      });

      renderPackages();
    }

    function renderPackages() {
      const stateFilter = document.getElementById("stateFilter").value;
      const sort = document.getElementById("sortFilter").value;

      let pkgs = allPackages.filter(p => !stateFilter || p.state === stateFilter);
      if (sort === "price_asc") pkgs.sort((a, b) => a.price - b.price);
      else if (sort === "price_desc") pkgs.sort((a, b) => b.price - a.price);
      else if (sort === "rating") pkgs.sort((a, b) => (b.rating || 0) - (a.rating || 0));

      document.getElementById("pkgCount").textContent = `${pkgs.length} package${pkgs.length !== 1 ? "s" : ""}`;

      if (!pkgs.length) {
        document.getElementById("packagesGrid").innerHTML = `<div class="empty-state"><div class="empty-icon">🏞</div><h3>No packages found</h3><p>Try a different filter.</p></div>`;
        return;
      }
      document.getElementById("packagesGrid").innerHTML = `
    <div class="grid-3">
      ${pkgs.map(p => `
        <div class="card package-card">
          <div class="card-img-wrap">
            <img class="card-img" src="${p.imageUrl || ''}" alt="${p.title}" onerror="this.style.background='var(--border)';this.src=''">
            ${p.featured ? '<span class="badge-featured">Featured</span>' : ''}
            <span class="badge-state">${p.state}</span>
          </div>
          <div class="card-body">
            <h3>${p.title}</h3>
            <div class="package-meta">
              <span>📍 ${p.location}</span>
              <span>🕐 ${p.duration} days</span>
              <span>👥 Max ${p.maxPersons}</span>
            </div>
            <div class="stars">${renderStars(p.rating || 4)} <small class="text-muted">(${p.reviewCount || 0})</small></div>
            <p style="font-size:.85rem;color:var(--text-muted);margin-top:.5rem;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden">${p.description || ''}</p>
            <div class="package-price">
              <div><div class="price-label">Starting from</div><div class="price-amount">${formatPrice(p.price)}</div></div>
              <a href="/package.html?id=${p.id}" class="btn btn-primary btn-sm">View</a>
            </div>
          </div>
        </div>`).join("")}
    </div>`;
    }

    document.getElementById("stateFilter").addEventListener("change", renderPackages);
    document.getElementById("sortFilter").addEventListener("change", renderPackages);

    loadPackages().catch(console.error);
    renderFooter();
  </script>
</body>

</html>
